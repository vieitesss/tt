[package]
name = "tt"
version = "0.3.2"
edition = "2021"
rust-version = "1.85"
description = "ToTask — a keyboard-driven terminal todo graph"
license = "MIT"
publish = false

[lib]
name = "tt"
path = "src/lib.rs"

[[bin]]
name = "tt"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29.0"
notify = "8"
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.8.7"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9.34"
thiserror = "2.0.19"
toml = "1.1"
unicode-width = "0.2.2"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
